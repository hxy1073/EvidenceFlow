<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAG 双范围检索评测</title>
  <style>
    :root{--bg:#f5f7f5;--panel:#fff;--ink:#17211d;--muted:#68746f;--line:#d7ded9;--accent:#13715f;--candidate:#815b24;--danger:#a33f36}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}main{width:min(1400px,calc(100% - 32px));margin:auto;padding:26px 0 50px}
    header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}h1{margin:0;font-size:29px}.sub{margin:7px 0 0;color:var(--muted);font-size:14px}.status{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}.dot{display:inline-block;width:9px;height:9px;margin-right:8px;border-radius:50%;background:#999}.dot.ok{background:var(--accent)}.dot.bad{background:var(--danger)}
    form{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr) 105px 125px;gap:12px;align-items:end;padding:18px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 14px 36px #16231e12}label{display:block;margin-bottom:7px;color:var(--muted);font-size:13px;font-weight:700}textarea,input{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font:inherit}textarea{height:100px;padding:11px;resize:vertical;line-height:1.55}input{height:44px;padding:0 10px}button{height:44px;border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    .summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}.metric{padding:13px;border:1px solid var(--line);border-radius:8px;background:#fff}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:6px;font-size:19px}.ranges{display:grid;grid-template-columns:1fr 1fr;gap:16px}.range{min-width:0}.range-head{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 9px}.range-head h2{margin:0;font-size:18px}.badge{padding:4px 8px;border-radius:99px;background:#e5f2ed;color:var(--accent);font-size:12px;font-weight:800}.candidate .badge{background:#f4eadb;color:var(--candidate)}
    .scores{display:grid;grid-template-columns:1fr;gap:9px;margin-bottom:10px}.score{padding:13px;border:1px solid var(--line);border-radius:8px;background:#fff}.score span{display:block;color:var(--muted);font-size:12px}.score strong{font-size:25px}.evaluation{min-height:75px;margin-bottom:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#3c4944;font-size:13px;line-height:1.6}.evaluation details{margin-top:5px}.docs{display:grid;gap:10px}.empty,.error{padding:25px;border:1px dashed var(--line);border-radius:8px;background:#ffffffaa;color:var(--muted);text-align:center}.error{border-color:#e0b8b3;background:#fff1ef;color:var(--danger)}article{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}.chunk-head{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#f1f5f2}.tag{color:var(--accent);font:800 12px Consolas,monospace}.path{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.relevant{color:var(--accent);font-size:12px;font-weight:800}pre.content{max-height:310px;margin:0;padding:13px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 Consolas,"Microsoft YaHei",monospace}details.meta{padding:0 13px 10px;color:var(--muted);font-size:12px}.meta pre{white-space:pre-wrap}
    @media(max-width:1000px){form{grid-template-columns:1fr 1fr}.ranges{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){main{width:calc(100% - 18px)}header{align-items:start;flex-direction:column}form,.summary{grid-template-columns:1fr}.scores{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><main>
  <header><div><h1>RAG 双范围检索评测</h1><p class="sub">一次模型调用同时评测最终 Top K 与候选 Candidate K；刷新后自动恢复最近结果。</p></div><div class="status"><i id="dot" class="dot"></i><span id="health">检查服务中</span></div></header>
  <form id="form">
    <div><label for="query">问题</label><textarea id="query" required placeholder="输入要检索的问题"></textarea></div>
    <div><label for="reference">标准答案 / 期望召回要点</label><textarea id="reference" required placeholder="用于确定召回率的分母；请尽量列出完整事实要点"></textarea></div>
    <div><label for="topK">Top K</label><input id="topK" type="number" min="1" max="100" value="3" required></div>
    <div><label for="candidateK">Candidate K</label><input id="candidateK" type="number" min="1" max="100" value="32" required></div>
    <button id="submit" type="submit">检索并评测</button>
  </form>
  <section class="summary"><div class="metric"><span>当前领域</span><strong id="domain">-</strong></div><div class="metric"><span>评测模型</span><strong id="evalModel">-</strong></div><div class="metric"><span>Top K 文档数</span><strong id="topCount">-</strong></div><div class="metric"><span>Candidate K 文档数</span><strong id="candidateCount">-</strong></div><div class="metric"><span>总耗时</span><strong id="elapsed">-</strong></div></section>
  <section class="ranges">
    <div class="range"><div class="range-head"><h2>最终召回文档</h2><span id="topBadge" class="badge">Top K</span></div><div class="scores"><div class="score"><span>检索召回率</span><strong id="topRecall">-</strong></div></div><div id="topEval" class="evaluation">等待评测</div><div id="topDocs" class="docs"><div class="empty">等待检索</div></div></div>
    <div class="range candidate"><div class="range-head"><h2>候选范围召回文档</h2><span id="candidateBadge" class="badge">Candidate K</span></div><div class="scores"><div class="score"><span>检索召回率</span><strong id="candidateRecall">-</strong></div></div><div id="candidateEval" class="evaluation">等待评测</div><div id="candidateDocs" class="docs"><div class="empty">等待检索</div></div></div>
  </section>
</main><script>
  const $=s=>document.querySelector(s);let currentDomain="-";const STORAGE_KEY="rag-checker:last-result:v2";
  const percent=v=>Number.isFinite(Number(v))?`${(Number(v)*100).toFixed(1)}%`:"-";
  function pathOf(c){const h=c.metadata?.headers;return Array.isArray(h)?h.map(x=>x?.[1]).filter(Boolean).join(" > "):""}
  function card(c,i,relevant){const a=document.createElement("article"),head=document.createElement("div"),pre=document.createElement("pre"),meta=document.createElement("details");head.className="chunk-head";const left=document.createElement("div"),tag=document.createElement("div"),path=document.createElement("div");tag.className="tag";tag.textContent=`CHUNK ${String(i+1).padStart(2,"0")}`;path.className="path";path.textContent=pathOf(c)||"无标题路径";left.append(tag,path);head.append(left);if(relevant?.includes(i+1)){const mark=document.createElement("span");mark.className="relevant";mark.textContent="模型判定：相关";head.append(mark)}pre.className="content";pre.textContent=c.content||"（空内容）";meta.className="meta";const sum=document.createElement("summary"),m=document.createElement("pre");sum.textContent="查看 metadata";m.textContent=JSON.stringify(c.metadata||{},null,2);meta.append(sum,m);a.append(head,pre,meta);return a}
  function renderDocs(el,chunks,relevant=[]){el.replaceChildren(...(chunks.length?chunks.map((c,i)=>card(c,i,relevant)):[Object.assign(document.createElement("div"),{className:"empty",textContent:"没有返回文档"})]))}
  function renderEval(scope,data){$(`#${scope}Recall`).textContent=percent(data.retrieval_recall);const el=$(`#${scope}Eval`),covered=(data.covered_points||[]).join("；")||"无",missed=(data.missed_points||[]).join("；")||"无";el.textContent=data.reason||"评测完成";const d=document.createElement("details"),s=document.createElement("summary"),p=document.createElement("div");s.textContent="查看覆盖明细";p.textContent=`已覆盖：${covered}\n未覆盖：${missed}`;p.style.whiteSpace="pre-wrap";d.append(s,p);el.append(d)}
  function showResult(data,elapsed){const topResult=data.top,candidateResult=data.candidate,top=topResult.documents||[],candidate=candidateResult.documents||[],topMetrics=topResult.metrics,candidateMetrics=candidateResult.metrics;$("#topCount").textContent=top.length;$("#candidateCount").textContent=candidate.length;$("#topBadge").textContent=`Top ${topResult.k}`;$("#candidateBadge").textContent=`Candidate ${candidateResult.k}`;$("#evalModel").textContent=data.model||topMetrics?.model||"-";$("#domain").textContent=data.domain||currentDomain;$("#elapsed").textContent=elapsed;if(topMetrics&&candidateMetrics){renderEval("top",topMetrics);renderEval("candidate",candidateMetrics)}else{$("#topRecall").textContent=$("#candidateRecall").textContent="评测中";$("#topEval").textContent=$("#candidateEval").textContent="文档已返回，后台正在调用模型评测…"}renderDocs($("#topDocs"),top,topMetrics?.relevant_context_indices||[]);renderDocs($("#candidateDocs"),candidate,candidateMetrics?.relevant_context_indices||[])}
  function restore(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(!saved)return;$("#query").value=saved.request.question||"";$("#reference").value=saved.request.reference_answer||"";$("#topK").value=saved.request.top_k;$("#candidateK").value=saved.request.candidate_k;showResult(saved.data,saved.elapsed||"-")}catch(err){console.warn("恢复最近评测失败",err)}}
  async function post(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),p=await r.json();if(!r.ok||p.code!==0)throw new Error(p.message||`HTTP ${r.status}`);return p}
  async function loadHealth(){try{const r=await fetch("/health"),p=await r.json();currentDomain=p.domain||"-";$("#domain").textContent=currentDomain;$("#dot").className="dot ok";$("#health").textContent=`服务正常 · ${currentDomain}`}catch{$("#dot").className="dot bad";$("#health").textContent="服务不可用"}}
  $("#form").addEventListener("submit",async e=>{e.preventDefault();const question=$("#query").value.trim(),reference_answer=$("#reference").value.trim(),top_k=Number($("#topK").value),candidate_k=Number($("#candidateK").value);if(!question||!reference_answer)return;if(candidate_k<top_k){alert("Candidate K 不能小于 Top K");return}const btn=$("#submit"),started=performance.now();let docsShown=false;btn.disabled=true;btn.textContent="检索中";["topDocs","candidateDocs"].forEach(id=>$("#"+id).innerHTML='<div class="empty">正在检索…</div>');try{
      const request={question,reference_answer,top_k,candidate_k},retrieval=await post("/rag_retrieve",{question,top_k,candidate_k}),retrievalElapsed=`${((performance.now()-started)/1000).toFixed(2)} s`;showResult(retrieval.data,retrievalElapsed);docsShown=true;localStorage.setItem(STORAGE_KEY,JSON.stringify({request,data:retrieval.data,elapsed:retrievalElapsed}));btn.textContent="评测中（文档已显示）";
      const top=retrieval.data.top.documents||[],candidate=retrieval.data.candidate.documents||[],evaluation=await post("/evaluate",{question,reference_answer,top_contexts:top.map(x=>x.content||""),candidate_contexts:candidate.map(x=>x.content||"")}),data={...retrieval.data,top:{...retrieval.data.top,metrics:evaluation.data.top},candidate:{...retrieval.data.candidate,metrics:evaluation.data.candidate}},elapsed=`${((performance.now()-started)/1000).toFixed(2)} s`;showResult(data,elapsed);localStorage.setItem(STORAGE_KEY,JSON.stringify({request,data,elapsed}))
    }catch(err){if(docsShown){$("#topEval").textContent=$("#candidateEval").textContent=`评测失败：${err.message||"执行失败"}`;$("#topRecall").textContent=$("#candidateRecall").textContent="-"}else{["topDocs","candidateDocs"].forEach(id=>$("#"+id).innerHTML=`<div class="error"></div>`);document.querySelectorAll(".error").forEach(x=>x.textContent=err.message||"执行失败")}$("#elapsed").textContent=`${((performance.now()-started)/1000).toFixed(2)} s`}finally{btn.disabled=false;btn.textContent="检索并评测"}});restore();loadHealth();
</script></body></html>
